[project]
name = "telegram-bots"
version = "0.1.0"
description = "Portfolio Telegram bots: SlotBook, ChatGuard AI, SplitMates"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
