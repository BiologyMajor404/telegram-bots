services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bots}
      POSTGRES_DB: bots
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bots -d bots"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Each bot gets only its own variables from .env (compose reads .env for ${...}),
  # so one bot can't see another bot's token or the Claude API key.
  slotbook:
    build: .
    command: ["python", "-m", "slotbook"]
    restart: unless-stopped
    environment:
      SLOTBOOK_TOKEN: ${SLOTBOOK_TOKEN}
      SLOTBOOK_ADMIN_IDS: ${SLOTBOOK_ADMIN_IDS:-}
      SLOTBOOK_CURRENCY: ${SLOTBOOK_CURRENCY:-₴}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Inside the compose network services are reached by name, not localhost
      SLOTBOOK_DATABASE_URL: postgresql+asyncpg://bots:${POSTGRES_PASSWORD:-bots}@postgres:5432/slotbook
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  splitmate:
    build: .
    command: ["python", "-m", "splitmate"]
    restart: unless-stopped
    environment:
      SPLITMATE_TOKEN: ${SPLITMATE_TOKEN}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SPLITMATE_DATABASE_URL: postgresql+asyncpg://bots:${POSTGRES_PASSWORD:-bots}@postgres:5432/splitmate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatguard:
    build: .
    command: ["python", "-m", "chatguard"]
    restart: unless-stopped
    environment:
      CHATGUARD_TOKEN: ${CHATGUARD_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHATGUARD_AI_LIMIT_FREE: ${CHATGUARD_AI_LIMIT_FREE:-50}
      CHATGUARD_AI_LIMIT_PRO: ${CHATGUARD_AI_LIMIT_PRO:-300}
      CHATGUARD_AI_LIMIT_GLOBAL: ${CHATGUARD_AI_LIMIT_GLOBAL:-1500}
      CHATGUARD_PRO_PRICE_STARS: ${CHATGUARD_PRO_PRICE_STARS:-250}
      CHATGUARD_SUPPORT_CONTACT: ${CHATGUARD_SUPPORT_CONTACT:-}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHATGUARD_DATABASE_URL: postgresql+asyncpg://bots:${POSTGRES_PASSWORD:-bots}@postgres:5432/chatguard
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
