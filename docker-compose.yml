services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bots}
      POSTGRES_DB: bots
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bots -d bots"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  slotbook:
    build: .
    command: ["python", "-m", "slotbook"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network services are reached by name, not localhost
      SLOTBOOK_DATABASE_URL: postgresql+asyncpg://bots:${POSTGRES_PASSWORD:-bots}@postgres:5432/slotbook
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  splitmate:
    build: .
    command: ["python", "-m", "splitmate"]
    restart: unless-stopped
    env_file: .env
    environment:
      SPLITMATE_DATABASE_URL: postgresql+asyncpg://bots:${POSTGRES_PASSWORD:-bots}@postgres:5432/splitmate
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
